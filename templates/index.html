<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Network - Test Bench</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; padding: 16px; }
    h2 { color: #22c55e; margin-bottom: 12px; font-size: 1.2rem; }
    
    .card { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    
    input, button { padding: 10px; border-radius: 6px; border: none; outline: none; font-size: 14px; }
    input { background: #0f172a; color: #fff; border: 1px solid #334155; width: 100%; }
    button { background: #22c55e; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #16a34a; }
    button.disabled { background: #64748b; cursor: not-allowed; }

    #chat-box { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14px; word-break: break-word; }
    .msg.sent { background: #15803d; align-self: flex-end; color: #fff; }
    .msg.received { background: #334155; align-self: flex-start; color: #fff; }
    .msg.system { background: #334155; align-self: center; font-size: 11px; opacity: 0.8; }

    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .status-dot.online { background: #22c55e; }
  </style>
</head>
<body>

  <h2><span id="dot" class="status-dot"></span>Spatial Network - Motor de Prueba WS</h2>

  <!-- Panel de Conexión -->
  <div class="card">
    <div class="grid">
      <input type="text" id="serverUrl" value="ws://localhost:8000/ws/chat" placeholder="URL WebSocket">
      <input type="text" id="userId" placeholder="Tu User ID (Ej: 1)">
    </div>
    <div class="grid">
      <input type="text" id="recipientId" placeholder="ID Destinatario (Ej: 2)">
      <button id="btnConnect" onclick="toggleConnect()">Conectar</button>
    </div>
  </div>

  <!-- Ventana de Chat -->
  <div id="chat-box">
    <div class="msg system">Ingresa tus IDs y presiona Conectar para iniciar la sesión.</div>
  </div>

  <!-- Envío de Mensaje -->
  <div class="card" style="display: flex; gap: 8px;">
    <input type="text" id="msgInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMsg()">Enviar</button>
  </div>

  <script>
    let ws = null;
    let isConnected = false;

    function toggleConnect() {
      if (isConnected) {
        ws.close();
        return;
      }

      const serverUrl = document.getElementById('serverUrl').value.trim();
      const userId = document.getElementById('userId').value.trim();

      if (!userId) {
        alert("Por favor ingresa un User ID.");
        return;
      }

      const fullUrl = `${serverUrl}?user_id=${userId}&token=dummy_token`;
      ws = new WebSocket(fullUrl);

      ws.onopen = () => {
        isConnected = true;
        document.getElementById('dot').classList.add('online');
        document.getElementById('btnConnect').innerText = "Desconectar";
        document.getElementById('btnConnect').style.background = "#ef4444";
        logSystem(`🟢 Conectado con exito como Usuario #${userId}`);
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Evento recibido:", data);

        if (data.type === 'new_message') {
          appendMessage(data.content || '[Archivo Multimedia]', 'received', `De #${data.sender_id}`);
        } else if (data.type === 'server_ack') {
          logSystem(`✔ Servidor confirmó mensaje: Status -> ${data.status}`);
        } else if (data.type === 'presence_status') {
          logSystem(`👤 Usuario #${data.user_id} está ahora: ${data.status}`);
        }
      };

      ws.onclose = () => {
        isConnected = false;
        document.getElementById('dot').classList.remove('online');
        document.getElementById('btnConnect').innerText = "Conectar";
        document.getElementById('btnConnect').style.background = "#22c55e";
        logSystem("🔴 Conexión cerrada.");
      };

      ws.onerror = (err) => {
        console.error("Error WS:", err);
        logSystem("⚠️ Error en la conexión WebSocket.");
      };
    }

    function sendMsg() {
      if (!isConnected) {
        alert("Primero debes conectarte al servidor.");
        return;
      }

      const recipientId = document.getElementById('recipientId').value.trim();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();

      if (!recipientId) {
        alert("Debes ingresar el ID del Destinatario.");
        return;
      }
      if (!text) return;

      const payload = {
        type: "send_message",
        message_id: "msg_" + Date.now(),
        recipient_id: recipientId,
        content: text,
        media_url: null,
        timestamp: new Date().toISOString()
      };

      ws.send(JSON.stringify(payload));
      appendMessage(text, 'sent', 'Tú');
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMsg();
    }

    function appendMessage(text, type, senderStr) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = `<small style="display:block; opacity:0.7; font-size:10px;">${senderStr}</small>${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function logSystem(text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg system';
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
