<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Network - Motor de Prueba WS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b1320;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 12px;
    }

    /* Encabezado */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #22c55e;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ef4444;
      display: inline-block;
      transition: background-color 0.3s;
    }

    .status-dot.online {
      background-color: #22c55e;
    }

    /* Tarjetas de Contenido */
    .card {
      background: #151e32;
      border: 1px solid #233048;
      border-radius: 12px;
      padding: 12px;
    }

    /* Formulario de Configuración (Grid 2x2) */
    .settings-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    input {
      background: #0b1320;
      border: 1px solid #233048;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: #22c55e;
    }

    .btn-connect {
      background: #22c55e;
      color: #0b1320;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .btn-connect.connected {
      background: #ef4444;
      color: #ffffff;
    }

    /* Caja del Chat */
    #chat-window {
      flex: 1;
      background: #151e32;
      border: 1px solid #233048;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .sys-msg {
      align-self: center;
      background: #233048;
      color: #94a3b8;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 13px;
      text-align: center;
      max-width: 85%;
    }

    .msg-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      word-break: break-word;
    }

    .msg-bubble.sent {
      align-self: flex-end;
      background: #15803d;
      color: #ffffff;
    }

    .msg-bubble.received {
      align-self: flex-start;
      background: #233048;
      color: #ffffff;
    }

    /* Barra Inferior de Entrada */
    .input-bar {
      display: flex;
      gap: 8px;
    }

    .btn-send {
      background: #22c55e;
      color: #0b1320;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Título con indicador -->
  <div class="header">
    <span id="statusDot" class="status-dot"></span>
    <span>Spatial Network - Motor de Prueba WS</span>
  </div>

  <!-- Formulario de Conexión -->
  <div class="card">
    <div class="settings-grid">
      <input type="text" id="wsUrl" placeholder="wss://tu-app.onrender.com/ws/chat">
      <input type="text" id="recipientId" placeholder="ID Destinatario (ej: 2)">
      <input type="text" id="userId" placeholder="Tu User ID (ej: 1)">
      <button id="btnConnect" class="btn-connect" onclick="toggleConnection()">Conectar</button>
    </div>
  </div>

  <!-- Ventana de Chat -->
  <div id="chat-window">
    <div id="systemPill" class="sys-msg">
      Ingresa tus IDs y presiona Conectar para iniciar la sesión.
    </div>
  </div>

  <!-- Barra para enviar mensaje -->
  <div class="card input-bar">
    <input type="text" id="msgInput" placeholder="Escribe un mensaje..." onkeypress="handleEnter(event)">
    <button class="btn-send" onclick="sendMessage()">Enviar</button>
  </div>

  <script>
    let socket = null;
    let isConnected = false;

    // Autocompleta la URL del WebSocket según Render o Local
    window.onload = () => {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      document.getElementById('wsUrl').value = `${protocol}//${window.location.host}/ws/chat`;
    };

    function toggleConnection() {
      if (isConnected) {
        socket.close();
        return;
      }

      const url = document.getElementById('wsUrl').value.trim();
      const userId = document.getElementById('userId').value.trim();

      if (!userId) {
        alert("Ingresa tu ID de usuario");
        return;
      }

      const fullUrl = `${url}?user_id=${userId}&token=dummy_token`;
      socket = new WebSocket(fullUrl);

      socket.onopen = () => {
        isConnected = true;
        document.getElementById('statusDot').classList.add('online');
        const btn = document.getElementById('btnConnect');
        btn.innerText = "Desconectar";
        btn.classList.add('connected');
        
        updateSystemPill(`🟢 Conectado en vivo como Usuario #${userId}`);
      };

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'new_message') {
          addMessage(data.content, 'received', `De #${data.sender_id}`);
        } else if (data.type === 'server_ack') {
          updateSystemPill(`✔ Mensaje guardado/entregado (${data.status})`);
        } else if (data.type === 'presence_status') {
          updateSystemPill(`👤 Usuario #${data.user_id} está ${data.status}`);
        }
      };

      socket.onclose = () => {
        isConnected = false;
        document.getElementById('statusDot').classList.remove('online');
        const btn = document.getElementById('btnConnect');
        btn.innerText = "Conectar";
        btn.classList.remove('connected');
        updateSystemPill("🔴 Desconectado del servidor.");
      };

      socket.onerror = (err) => {
        console.error("WS Error:", err);
        updateSystemPill("⚠️ Error de conexión al WebSocket.");
      };
    }

    function sendMessage() {
      if (!isConnected) {
        alert("Primero conéctate al servidor.");
        return;
      }

      const recipientId = document.getElementById('recipientId').value.trim();
      const input = document.getElementById('msgInput');
      const content = input.value.trim();

      if (!recipientId || !content) return;

      const payload = {
        type: "send_message",
        message_id: "msg_" + Date.now(),
        recipient_id: recipientId,
        content: content,
        media_url: null,
        timestamp: new Date().toISOString()
      };

      socket.send(JSON.stringify(payload));
      addMessage(content, 'sent', 'Tú');
      input.value = '';
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function addMessage(text, type, sender) {
      const box = document.getElementById('chat-window');
      const div = document.createElement('div');
      div.className = `msg-bubble ${type}`;
      div.innerHTML = `<small style="display:block; opacity:0.7; font-size:10px;">${sender}</small>${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function updateSystemPill(text) {
      const pill = document.getElementById('systemPill');
      if (pill) pill.innerText = text;
    }
  </script>
</body>
</html>
